resource:
    name: RefreshTokens
    shortName: refresh-tokens
    description: 'Exchanges a refresh token of a Back Office user or a merchant user for a new token pair.'

    processor: Spryker\Glue\OauthBackendApi\Api\Backend\Processor\RefreshTokensBackendProcessor
    paginationEnabled: false

    operations:
        - type: Post
          uriTemplate: '/refresh-tokens'
          description: 'Exchanges a valid refresh token for a new access token and refresh token. The previous pair is revoked.'
          normalizationContext:
              gen_id: false
          openapiContext:
              responses:
                  201:
                      description: 'A new access token and refresh token pair.'
                  401:
                      description: 'The refresh token is invalid, expired or revoked.'
                  422:
                      description: 'The refresh token is missing.'

    properties:
        refreshToken:
            type: string
            writable: true
            readable: true
            identifier: true
            required: true
            description: 'Refresh token to exchange; the response carries the newly issued one'
            openapiContext:
                example: 'def50200a1b2c3d4e5f6789012345678901234567890abcdef...'

        accessToken:
            type: string
            writable: false
            readable: true
            description: 'JWT access token for authenticating subsequent API requests'
            openapiContext:
                example: 'eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...'

        tokenType:
            type: string
            writable: false
            readable: true
            description: 'Token type, always Bearer for OAuth 2.0'
            openapiContext:
                example: 'Bearer'

        expiresIn:
            type: integer
            writable: false
            readable: true
            description: 'Token lifetime in seconds from issuance'
            openapiContext:
                example: 3600
